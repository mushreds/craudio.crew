<!-- @dsCard height=300 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&family=Climate+Crisis:YEAR@1979&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { background: var(--fundo, #1a0838); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--fundo, #1a0838); }
  .cover svg { position: absolute; inset: 0; }
  .text { position: absolute; left: 40px; bottom: 32px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display, "Climate Crisis", "Arial Black", sans-serif); font-size: 64px; line-height: .95; font-weight: 400; color: var(--tinta, #f1ece4); white-space: nowrap; font-variation-settings: "YEAR" 1979; }
  .tag { margin: 16px 0 0; font-family: var(--font-round, "Baloo 2", system-ui, sans-serif); font-size: 14px; font-weight: 500; color: var(--tinta-suave, #cfc6ea); }
  .queimado { fill: var(--laranja-queimado, #e8480c); }
  .laranja { fill: var(--laranja, #ff7a1a); }
  .vibrante { fill: var(--roxo-vibrante, #6a2fe0); }
  .roxo { fill: var(--roxo, #8b6cf5); }
  .claro { fill: var(--roxo-claro, #b8a4ff); }
  .pessego { fill: var(--pessego, #ffc79a); }
  .bloco { rx: var(--radius-lg, 32px); }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!--
      blocks: laranja-queimado 168x216 (chão Folhas), roxo-vibrante 296x128 (faixas do Fluido), pessego 128x88 (nuvens), roxo 152x120
      arrangement: laje alta queimada sangrando no topo, faixa roxa vibrante sangrando topo e direita, dois satélites embaixo
      pattern: pílulas de massinha (blobs da ref-blobs-a2), porque tudo na marca escorre e a v2 nasce dos blobs e faixas do Fluido
      scales: pílulas de 24px (space-3) e 40px (space-4) de altura, cantos radius-lg nos satélites, rx de meia altura nas pílulas
    -->
    <rect class="queimado" x="512" y="-16" width="168" height="232" />
    <rect class="vibrante" x="696" y="-16" width="296" height="144" />
    <rect class="pessego bloco" x="696" y="200" width="128" height="88" />
    <rect class="roxo bloco" x="840" y="168" width="152" height="152" />
    <rect class="laranja" x="536" y="24" width="96" height="40" rx="20" />
    <rect class="laranja" x="560" y="80" width="104" height="24" rx="12" />
    <rect class="laranja" x="528" y="120" width="64" height="40" rx="20" />
    <rect class="laranja" x="608" y="136" width="56" height="24" rx="12" />
    <rect class="laranja" x="544" y="176" width="96" height="24" rx="12" />
    <rect class="claro" x="720" y="16" width="120" height="24" rx="12" />
    <rect class="claro" x="856" y="8" width="64" height="40" rx="20" />
    <rect class="claro" x="736" y="64" width="64" height="40" rx="20" />
    <rect class="claro" x="816" y="72" width="136" height="24" rx="12" />
    <rect class="laranja" x="864" y="200" width="104" height="24" rx="12" />
    <rect class="laranja" x="864" y="240" width="56" height="40" rx="20" />
  </svg>
  <div class="text">
    <p class="name">CRAUDIO<br>CREW</p>
    <p class="tag">v3 · Um universo laranja e roxo onde a capivara vive.</p>
  </div>
</div>
</body>
</html>
