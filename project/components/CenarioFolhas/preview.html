  .t-claro{fill:var(--roxo-claro,#b8a4ff)} .t-laranja{fill:var(--laranja,#ff7a1a)} .t-suave{fill:var(--tinta-suave,#cfc6ea)}

  .placa { position: absolute; left: 40px; bottom: 40px; background: var(--laranja-queimado,#e8480c); border-radius: var(--radius-lg, 32px); padding: 24px 28px; max-width: 460px; }
  .tag { font-family: var(--font-pixel, "Silkscreen", monospace); font-size: 14px; letter-spacing: .06em; color: var(--fundo,#1a0838); margin: 0 0 10px; }
