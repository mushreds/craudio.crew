<!doctype html>

<style>
  html, body { margin: 0; }

  .tag { font-family: var(--font-pixel, "Silkscreen", monospace); font-size: 11px; letter-spacing: .06em; margin: 0 0 8px; }
  .con { font-family: var(--font-round, "Baloo 2", system-ui, sans-serif); font-weight: 800; font-size: 15px; line-height: 1.1; margin: 0; }
  .gig { font-family: var(--font-display, "Climate Crisis", "Arial Black", sans-serif); font-variation-settings: "YEAR" 1979; font-size: 27px; line-height: 1; margin: 3px 0 8px; white-space: nowrap; }
  .nota { width: 260px; font-family: var(--font-round, "Baloo 2", system-ui, sans-serif); font-size: 15px; line-height: 1.45; font-weight: 500; color: var(--fundo,#1a0838); }
  .nota b { font-family: var(--font-pixel, "Silkscreen", monospace); font-weight: 400; font-size: 13px; letter-spacing: .06em; display: block; margin-bottom: 8px; }

      <p class="tag" style="color:var(--fundo,#1a0838)">CENÁRIO · FOLHAS</p>
      <p class="con" style="color:var(--fundo,#1a0838)">ESTOUREI O</p><p class="gig" style="color:var(--roxo-profundo,#2a0f5c)">LIMITE</p>
      <p class="con" style="color:var(--fundo,#1a0838)">FUI TOCAR NA</p><p class="gig" style="color:var(--roxo-profundo,#2a0f5c);margin-bottom:0">GRAMA</p>

<p class="nota"><b>FOLHAS</b>A frase vai numa placa da cor do chão, no vão entre as folhas. Texto sempre em fundo ou roxo-profundo.</p>
