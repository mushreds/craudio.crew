<!doctype html>
<html lang="pt-BR">
<head>

<style>
  html, body { margin: 0; }
  body { background: var(--roxo-profundo,#2a0f5c); }
  .palco { position: relative; width: 960px; height: 540px; overflow: hidden; }
  .palco > svg { position: absolute; inset: 0; }
  
  .g-fundo{fill:var(--fundo,#1a0838)} .g-profundo{fill:var(--roxo-profundo,#2a0f5c)}
  .f-laranja{fill:var(--laranja,#ff7a1a)} .f-queimado{fill:var(--laranja-queimado,#e8480c)}
  .f-escuro{fill:var(--laranja-escuro,#c9560a)} .f-pessego{fill:var(--pessego,#ffc79a)}
  .f-roxo{fill:var(--roxo,#8b6cf5)} .f-vibrante{fill:var(--roxo-vibrante,#6a2fe0)}
  .f-claro{fill:var(--roxo-claro,#b8a4ff)} .f-tinta{fill:var(--tinta,#f1ece4)}
  .f-suave{fill:var(--tinta-suave,#cfc6ea)}
  .s-escuro{stroke:var(--laranja-escuro,#c9560a)} .s-queimado{stroke:var(--laranja-queimado,#e8480c)}
  .s-tinta{stroke:var(--tinta,#f1ece4)} .s-pessego{stroke:var(--pessego,#ffc79a)}
  .s-laranja{stroke:var(--laranja,#ff7a1a)} .s-vibrante{stroke:var(--roxo-vibrante,#6a2fe0)}
  .s-roxo{stroke:var(--roxo,#8b6cf5)} .s-claro{stroke:var(--roxo-claro,#b8a4ff)}
  .s-profundo{stroke:var(--roxo-profundo,#2a0f5c)}
  .t-claro{fill:var(--roxo-claro,#b8a4ff)} .t-laranja{fill:var(--laranja,#ff7a1a)} .t-suave{fill:var(--tinta-suave,#cfc6ea)}

  .placa { position: absolute; left: 40px; bottom: 40px; background: var(--roxo-profundo,#2a0f5c); border-radius: var(--radius-lg, 32px); padding: 24px 28px; max-width: 460px; }
  .tag { font-family: var(--font-pixel, "Silkscreen", monospace); font-size: 14px; letter-spacing: .06em; color: var(--laranja,#ff7a1a); margin: 0 0 10px; }
  .con { font-family: var(--font-round, "Baloo 2", system-ui, sans-serif); font-weight: 800; font-size: 22px; line-height: 1.1; color: var(--tinta,#f1ece4); margin: 0; }
  .gig { font-family: var(--font-display, "Climate Crisis", "Arial Black", sans-serif); font-variation-settings: "YEAR" 1979; font-size: 44px; line-height: 1; color: var(--roxo-claro,#b8a4ff); margin: 4px 0 10px; white-space: nowrap; }
</style>
</head>
<body>
