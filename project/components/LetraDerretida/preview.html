<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Climate+Crisis:YEAR@1979..2050&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { background: var(--fundo, #1a0838); padding: 28px 40px; }
  .linha { display: flex; align-items: center; gap: 24px; margin-bottom: 14px; }
  .rotulo { width: 150px; font-family: var(--font-mono, "JetBrains Mono", ui-monospace, monospace); font-size: 12px; letter-spacing: .08em; color: var(--tinta, #f1ece4); }
  .palavra { font-family: var(--font-display, "Climate Crisis", "Arial Black", sans-serif); font-size: 56px; line-height: 1; white-space: nowrap; }
  .a { color: var(--laranja, #ff7a1a); font-variation-settings: "YEAR" 1979; }
  .b { color: var(--laranja, #ff7a1a); font-variation-settings: "YEAR" 2000; }
  .d { color: var(--roxo-claro, #b8a4ff); font-variation-settings: "YEAR" 2019; }
  .e { color: var(--tinta-suave, #b9b4c7); font-variation-settings: "YEAR" 2050; }
</style>
</head>
<body>
  <div class="linha"><span class="rotulo">1979 · PADRÃO</span><span class="palavra a">LIMITE</span></div>
  <div class="linha"><span class="rotulo">2000 · AVISO</span><span class="palavra b">LIMITE</span></div>
  <div class="linha"><span class="rotulo">2019 · MÁXIMO</span><span class="palavra d">LIMITE</span></div>
  <div class="linha"><span class="rotulo">2050 · NÃO USAR</span><span class="palavra e">LIMITE</span></div>
</body>
