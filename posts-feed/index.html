<html lang="pt-BR"><head><meta charset="utf-8"><title>Craudio Crew · posts de feed</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Climate+Crisis:YEAR@1979..2050&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--fundo:#1a0838;--roxo-profundo:#2a0f5c;--roxo:#8b6cf5;--roxo-claro:#b8a4ff;--laranja:#ff7a1a;--laranja-queimado:#e8480c;--tinta:#f1ece4}
html,body{margin:0;background:#000}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;display:none}
.post.on{display:block}
.topo{position:absolute;left:0;top:0;width:1080px;height:742px;overflow:hidden}
.topo img{width:100%;height:100%;object-fit:cover}
.base{position:absolute;left:0;right:0;top:742px;bottom:0}
.capi{position:absolute;left:50%;transform:translateX(-50%);display:block}
.lim{position:absolute;width:112px;height:150px;left:742px;top:586px;transform:rotate(12deg)}
.sand{position:absolute;left:0;right:0;top:842px;display:flex;flex-direction:column;align-items:center;text-align:center}
.con{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:48px;line-height:1.05;letter-spacing:.02em;margin:0;display:flex;align-items:center;gap:22px}
.con.menor{font-size:42px;margin-top:10px}
.gig{font-family:"Climate Crisis","Arial Black",sans-serif;font-variation-settings:"YEAR" 1979;font-size:108px;line-height:.95;margin:40px 0 18px;transform:scaleY(1.22);transform-origin:50% 100%;white-space:nowrap}
.traco{width:40px;height:9px;border-radius:999px;transform:rotate(-8deg)}
.traco.b{transform:rotate(8deg)}
.l2{display:flex;align-items:center;gap:22px}
.raio{display:flex;flex-direction:column;gap:11px}
.raio i{display:block;width:30px;height:9px;border-radius:999px}
.raio.e i:nth-child(1){transform:rotate(24deg)}.raio.e i:nth-child(3){transform:rotate(-24deg)}
.raio.d i:nth-child(1){transform:rotate(-24deg)}.raio.d i:nth-child(3){transform:rotate(24deg)}
.ass{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;letter-spacing:.08em;margin-top:22px}
</style></head><body>
